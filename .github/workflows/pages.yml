name: Project site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      # Inputs of the site's build and tests that live outside apps/site.
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'README.md'
      - 'apps/web/public/favicon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.4

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@livro-caixa/site' test
      - run: bun run build:site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
